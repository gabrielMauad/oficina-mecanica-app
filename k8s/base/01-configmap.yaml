apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: oficina-mecanica
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
data:
  # Production, nao Development: o publish do SDK inclui appsettings.Development.json na imagem
  # (nao ha exclusao no .csproj/Dockerfile), mas com ASPNETCORE_ENVIRONMENT=Production o ASP.NET
  # Core so carrega appsettings.json + appsettings.Production.json (inexistente) - o arquivo de
  # Development fica no disco do container sem nunca ser lido. Toda configuracao obrigatoria em
  # runtime vem deste ConfigMap e do Secret oficina-secrets (criado pela pipeline). Nenhum
  # IsDevelopment()/branch de ambiente existe no codigo (Program.cs e Extensions/*), so o rotulo
  # deployment.environment do OpenTelemetry muda.
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Jwt__Issuer: "oficina-mecanica-app"
  Jwt__Audience: "oficina-mecanica-api"
  Jwt__ValidIssuers__0: "oficina-mecanica-app"
  Jwt__ValidIssuers__1: "oficina-mecanica-auth"
  Auth__AdminEmail: "admin@oficina.com"
  OpenApi__Enabled: "true"
  # OTEL_EXPORTER_OTLP_ENDPOINT NAO esta definido aqui de proposito: apontava para um Service
  # ("otel-collector.oficina-mecanica.svc.cluster.local") que nao existe neste cluster. Sem a
  # variavel, o SDK do OpenTelemetry para .NET cai no default "http://localhost:4317" e descarta
  # traces e metricas silenciosamente - nao trava a aplicacao e nao polui os logs do pod: falha de
  # exportacao e reportada no self-diagnostics do proprio OpenTelemetry (EventSource, ex.:
  # "OpenTelemetry-Exporter-OpenTelemetryProtocol"), nunca no ILogger/logs JSON da aplicacao. Isso
  # vale ate a ferramenta de APM ser configurada (RFC-004): quando isso acontecer, esta chave volta
  # aqui apontando para o destino real, e a chave de API vai no Secret (OTEL_EXPORTER_OTLP_HEADERS),
  # nunca aqui. Para depurar exportacao, o lugar certo e o self-diagnostics do OpenTelemetry, nao os
  # logs da aplicacao.
