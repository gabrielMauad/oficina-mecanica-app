services:
  api:
    build:
      context: .
      dockerfile: src/Bootstrap/Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Host=postgres;Port=5432;Username=oficina;Password=oficina-dev-pass;Database=oficina_mecanica;SSL Mode=Disable
      - Jwt__Secret=docker-dev-secret-key-replace-in-prod-000
      - Jwt__Issuer=oficina-mecanica-app
      - Jwt__Audience=oficina-mecanica-api
      - Jwt__ValidIssuers__0=oficina-mecanica-app
      - Jwt__ValidIssuers__1=oficina-mecanica-auth
      - Auth__AdminEmail=admin@oficina.com
      - Auth__AdminSenha=admin123
      - OpenApi__Enabled=true
      # OTLP: destino configurável por variável de ambiente padrão do OpenTelemetry (ADR-004),
      # sem nada específico de fornecedor. Aqui aponta para o Jaeger local do compose; em outro
      # ambiente basta trocar o endpoint (e, se preciso, OTEL_EXPORTER_OTLP_HEADERS) para o
      # coletor/APM real — nenhum código muda. Traces e métricas chegam no Jaeger normalmente;
      # logs (RFC-004, Tarefa 3) também são exportados para este mesmo endpoint, mas o Jaeger
      # all-in-one não implementa o serviço OTLP de logs — essas tentativas falham em silêncio no
      # self-diagnostics do OpenTelemetry (mesmo padrão que métricas já tinham antes desta
      # mudança), nunca no console/`docker compose logs api`.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: oficina-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI: http://localhost:16686
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  postgres:
    image: postgres:16
    restart: always
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina_mecanica
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina-dev-pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_mecanica"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
