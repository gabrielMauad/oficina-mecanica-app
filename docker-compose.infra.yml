# Dependências compartilhadas entre os serviços da oficina no ambiente local (D19).
# Cria a rede `oficina-local` e sobe o LocalStack (SQS/SNS/DynamoDB) e o Jaeger (traces).
# Ordem de uso:
#   1. docker compose -f docker-compose.infra.yml up -d      (este arquivo, uma vez)
#   2. docker compose up -d                                  (neste repo e em cada serviço desejado)
# Os `docker-compose.yml` dos serviços entram nesta rede como rede externa (`oficina-local`).
name: oficina-infra

networks:
  oficina-local:
    name: oficina-local

services:
  localstack:
    # Versão fixada: a série 4.x é a última que sobe sem LOCALSTACK_AUTH_TOKEN (as versões
    # 2026.x exigem token de conta e encerram com "License activation failed").
    image: localstack/localstack:4.14.0
    container_name: oficina-localstack
    environment:
      - SERVICES=sqs,sns,dynamodb
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - oficina-local

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: oficina-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI: http://localhost:16686
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - oficina-local
