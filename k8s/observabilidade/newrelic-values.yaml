# Values do chart nri-bundle (New Relic Kubernetes integration), RFC-004 secao 6.1.
#
# Instalado pela pipeline do servico ordens-servico (.github/workflows/ci-cd.yml, job "Deploy no
# EKS"), DEPOIS do deploy e do smoke test do servico, via:
#
#   helm upgrade --install newrelic-bundle newrelic/nri-bundle \
#     --version 8.0.24 \
#     --namespace newrelic \
#     -f k8s/observabilidade/newrelic-values.yaml
#
# Esta e a unica pipeline que instala o bundle: as metricas de node e pod sao do cluster inteiro,
# nao de um servico. Os demais servicos nao tocam no namespace newrelic.
#
# Versao do chart fixada em 8.0.24 (tag existente em
# https://github.com/newrelic/helm-charts/tree/nri-bundle-8.0.24 - confirmada em 2026-09-15).
#
# Cobre SO o requisito "CPU e memoria do Kubernetes" (metricas de node/pod). Traces, metricas de
# negocio e runtime do processo .NET ja saem por OTLP direto de cada servico (ConfigMap
# <servico>-config em k8s/) - nao dependem deste chart.
#
# License key: NAO fica aqui (nunca em texto plano em values versionado). A pipeline cria o Secret
# do Kubernetes "newrelic-license-key" no namespace "newrelic" a partir do secret do GitHub
# NEW_RELIC_LICENSE_KEY (mesmo secret usado em OTEL_EXPORTER_OTLP_HEADERS, no Secret
# ordens-servico-secrets), e o chart le esse Secret via global.customSecretName/
# customSecretLicenseKey abaixo - nunca via --set global.licenseKey.
#
# Conta de capacidade - 3 nos t3.medium (2 vCPU / 4 GiB; desired 3, min 2, max 4 no node group),
# cinco servicos escalando ate 3 replicas cada. Todos os valores abaixo sao REQUESTS (o que o
# scheduler soma), derivados dos manifestos e dos defaults dos add-ons do EKS - nao medidos no
# cluster. Alocavel por no estimado em ~1,93 vCPU (valor confirmado via `kubectl describe nodes`
# num no de 2 vCPU) e ~3,3 GiB de memoria (4 GiB menos a reserva do kubelet):
#   - bundle: kubelet (DaemonSet, containers kubelet+agent) 150m / 250Mi POR NO; ksm (coletor,
#     1 replica) 80m / 128Mi; kube-state-metrics (1 replica) 50m / 64Mi. Com 3 nos: 580m / 942Mi.
#   - sistema: aws-node, kube-proxy, coredns x2, metrics-server x2: ~775m / ~540Mi no total.
#   - aplicacao: 5 servicos x 3 replicas x (100m / 256Mi) = 1500m / 3840Mi no pico do HPA.
#   - total no pico: ~2855m de ~5790m de CPU (~49%) e ~5,2 GiB de ~9,7 GiB de memoria (~54%).
#   - pods: 15 da aplicacao + 11 de sistema + 4 do bundle = ~30 de 51 (17 pods/no no t3.medium).
# Com o node group no minimo (2 nos) o pico ainda cabe: ~67% de CPU, ~77% de memoria e 27 pods
# de 34. Nenhum dos tres recursos e o limite: ha folga para todos os servicos escalarem ao teto.

global:
  cluster: oficina-mecanica
  customSecretName: newrelic-license-key
  customSecretLicenseKey: licenseKey
  # Reduz o volume de dados enviado (amostra o agente de infra a cada 30s em vez de 15s, corta
  # atributos de baixo valor) - recomendado pela New Relic para clusters pequenos como este, e
  # ajuda a nao pressionar a cota de 100 GB/mes do plano gratuito (RFC-004, secao 4.1).
  lowDataMode: true

# --- Agente de infraestrutura (obrigatorio: e ele quem publica CPU/memoria de node e pod) ---
newrelic-infrastructure:
  enabled: true
  privileged: true
  # O control plane do EKS e gerenciado pela AWS e nao e acessivel pelos nos deste cluster
  # (RFC-002) - deixar habilitado so gera tentativas de scrape que falham e ruido de log, sem
  # nenhum dado a mais.
  controlPlane:
    enabled: false
  # kube-state-metrics (o bloco "kube-state-metrics:" la embaixo, subchart separado) e quem
  # fornece metricas de estado do cluster (pods/deployments/etc); este agente (ksm: abaixo) e o
  # COLETOR do New Relic que consulta aquele kube-state-metrics - dois componentes diferentes.
  #
  # A partir da v3 do subchart newrelic-infrastructure (empacotado nesta versao do nri-bundle) o
  # antigo `resources` unico (nivel raiz deste bloco) nao e mais aceito - a chart falha o render
  # e pede para configurar por componente (ksm.resources / controlPlane.resources /
  # kubelet.resources, ver NOTES.txt do subchart). Alem disso cada componente roda como um Pod de
  # 2 containers, e o `<componente>.resources` "legado" (nivel do componente) so cobre 1 dos 2
  # containers - por isso configuramos os dois containers de cada um explicitamente (ver
  # `helm show values newrelic/newrelic-infrastructure --version 4.6.2`, que e a versao exata do
  # subchart empacotada no nri-bundle 8.0.24):
  #   kubelet.kubelet.resources -> container "kubelet" (scraper, le a API do Kubelet)
  #   kubelet.agent.resources   -> container "agent" (infrastructure-bundle, encaminha os dados)
  #   ksm.ksm.resources         -> container "ksm" (scraper, consulta o kube-state-metrics)
  #   ksm.forwarder.resources   -> container "forwarder" (infrastructure-bundle, encaminha os dados)
  # controlPlane.resources fica de fora: controlPlane.enabled=false (control plane gerenciado
  # pela AWS, nao roda scraper nenhum aqui).
  #
  # kubelet e DaemonSet (1 pod por no) - e o componente do bundle que mais pesa na capacidade
  # dos nos (ver conta de capacidade no topo). ksm e um Deployment (1 replica so), pesa bem menos.
  ksm:
    enabled: true
    ksm:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    forwarder:
      resources:
        requests:
          cpu: 30m
          memory: 64Mi
        limits:
          cpu: 50m
          memory: 128Mi
  kubelet:
    kubelet:
      resources:
        requests:
          cpu: 100m
          memory: 150Mi
        limits:
          cpu: 200m
          memory: 300Mi
    agent:
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          cpu: 100m
          memory: 200Mi

# --- kube-state-metrics: exigido pelo agente de infra para metricas de pod/node completas ---
# Desabilitado por padrao no chart (kube-state-metrics.enabled=false) - precisa ser ligado
# explicitamente para cobrir o requisito de CPU/memoria por pod.
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# --- Tudo abaixo e explicitamente desligado: nao e requisito desta tarefa e cada um custa pods/
# recursos que o cluster nao precisa gastar (ver conta de capacidade no topo) ---

# Logs ja saem por OTLP direto da aplicacao (Tarefa 3) - o forwarder de log do cluster seria
# redundante (e so cobriria stdout, que a aplicacao ja envia por um caminho melhor, com contexto
# de trace nativo).
newrelic-logging:
  enabled: false

# Webhook de metadata injection (mutating webhook em todo pod criado no cluster) - nao e
# necessario para metricas de node/pod, e webhooks admission adicionam latencia/risco a criacao
# de qualquer pod do cluster, incluindo os da propria aplicacao durante o HPA escalando.
nri-metadata-injection:
  enabled: false

# Eventos do Kubernetes (Warning/Normal do cluster) - nao e requisito da spec (CPU/memoria e
# healthcheck, nao um feed de eventos).
nri-kube-events:
  enabled: false

# Scraper de endpoints Prometheus customizados - a aplicacao nao expoe /metrics Prometheus (usa
# OTLP), entao nao ha nada para este componente coletar.
nri-prometheus:
  enabled: false

# eBPF profiling (Pixie) - fora de escopo (spec pede CPU/memoria, nao profiling continuo), e e o
# componente mais pesado do bundle.
newrelic-pixie:
  enabled: false
pixie-chart:
  enabled: false

# Metrics adapter para HPA custom/external metrics via New Relic - o HPA deste projeto usa metrica
# nativa de CPU (metrics-server, k8s/12-hpa.yaml), nao precisa de metrica externa.
newrelic-k8s-metrics-adapter:
  enabled: false

# Operator adicional para injection via CRDs - default do chart ja e false; mantido explicito por
# clareza (nao usamos annotations de auto-instrumentacao neste projeto).
newrelic-infra-operator:
  enabled: false
